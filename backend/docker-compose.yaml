name: chatacter
services:
  livekit:
    image: livekit/livekit-server:latest@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    ports:
      - 7880:7880
      - 7881:7881
      - 7882:7882/udp
      - 8081:8081  # chatacter health check
    # Dev mode uses the key pair devkey / secret. Media is advertised on 127.0.0.1, so browsers on this machine and
    # the chatacter container (which shares this network namespace) can both reach it.
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    restart: on-failure:3
volumes:
  logs:
  assets:
  fastembed:
  checkpoint:
  gfpgan:
  huggingface:
  results:
